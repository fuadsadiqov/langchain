[project]
name = "langgraph-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fuad.sadigov", email = "fuad.sadigov@FUAD-SADIGOV" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
]

[project.scripts]
langgraph-rag = "langgraph_rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
